title: Curso de Machine Learning
description: Material del curso de Machine Learning de Mireia Consarnau
lang: es
baseurl: /machine_learning
url: https://mireiaconsarnau.github.io

remote_theme: just-the-docs/just-the-docs@v0.10.1
color_scheme: curso

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter

relative_links:
  enabled: true
  collections: false

# Buscador
search_enabled: true
search:
  heading_level: 2
  previews: 3
  button: false

# Enlaces arriba a la derecha
aux_links:
  "Ver en GitHub":
    - "https://github.com/mireiaconsarnau/machine_learning"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Volver arriba"

heading_anchors: true

footer_content: >-
  © 2025 Mireia Consarnau · Este curso se distribuye bajo la licencia
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es">Creative Commons BY-NC-SA 4.0</a>

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
